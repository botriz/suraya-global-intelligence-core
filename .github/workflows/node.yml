name: Suraya core security tests

on:
  push:
    branches:
      - main
      - security/encrypted-core-storage-2026-11
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
